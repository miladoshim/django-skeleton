[program:celery]
process_name=%(program_name)s_%(process_num)02d
directory=/app
command=celery -A cocooned worker -l INFO
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=10
stopwaitsecs=600
user=root
redirect_stderr=true
stdout_logfile=/usr/src/app/cocooned/logs/app-worker.log