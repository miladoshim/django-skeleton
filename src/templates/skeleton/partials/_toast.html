<div
    aria-live="polite"
    aria-atomic="true"
    class="position-fixed top-0 start-0 p-3"
    style="z-index: 2000"
    x-data="{ toasts: [] }"
    x-init="
         {% for message in messages %}
           toasts.push({body: '{{ message|escapejs }}', type: '{{ message.tags }}'});
         {% endfor %}
       "
>
    <template x-for="(toast, index) in toasts" :key="index">
        <div
            class="toast align-items-center text-bg-info border-0 mb-2 show"
            :class="{
             'alert-success': toast.type==='success',
             'bg-danger': toast.type==='danger',
             'bg-warning': toast.type==='warning',
             'bg-info': toast.type==='info'
           }"
            role="alert"
            aria-live="assertive"
            aria-atomic="true"
            x-init="setTimeout(()=>toasts.splice(index,1), 3000)"
        >
            <div class="d-flex">
                <div class="toast-body" x-text="toast.body"></div>
                <button
                    type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    @click="toasts.splice(index,1)"
                ></button>
            </div>
        </div>
    </template>
</div>
