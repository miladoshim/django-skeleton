{% extends 'accounts/layout.html' %}

{% block title %}
  داشبورد
{% endblock %}

{% block inner %}
  <div class="col-12 col-md-9 d-flex flex-column">

      <div class="row">
        <div class="col-12 col-md-6">
          <div class="card card-sm">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-auto">
                  <span class="bg-primary text-white avatar">
                    <!-- Download SVG icon from http://tabler.io/icons/icon/currency-dollar -->
                    <svg xmlns="http://www.w6.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">

                </div>
                <div class="col">
                  <div class="font-weight-medium">132 Sales</div>
                  <div class="text-secondary">12 waiting payments</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="card card-sm">
            <div class="card-body">
              <div class="row align-items-center">
                <div class="col-auto">
                  <span class="bg-green text-white avatar">
                    <!-- Download SVG icon from http://tabler.io/icons/icon/shopping-cart -->

                      <path d="M6 5l14 1l-1 7h-13" />

                  </span>
                </div>
                <div class="col">
                  <div class="font-weight-medium">78 Orders</div>
                  <div class="text-secondary">32 shipped</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
