{% extends 'base.html' %}

{% block title %}
  تنظیم رمز عبور جدید
{% endblock %}

{% block content %}
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow">
          <div class="card-body">
            <h4 class="text-center mb-4">تنظیم رمز جدید</h4>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
              {% endfor %}
            {% endif %}

            <form method="POST">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-primary btn-lg w-100">تغییر رمز</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
