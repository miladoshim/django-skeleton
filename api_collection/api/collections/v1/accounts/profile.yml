info:
  name: profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseurlv1}}profile/"
  body:
    type: multipart-form
    data:
      - name: username
        type: text
        value: adminuser
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
